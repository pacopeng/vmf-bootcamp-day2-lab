---
# Participant inventory for the Day 2 labs on the RHDP "Migration Factory" environment.
# Use it together with inventory-openshift-virt-bootcamp-base.yml (do not edit the base file).
# Replace every <...> placeholder. Keep this file on your laptop only: do not commit real values.

all:
  vars:

    # Container registry credentials (quay.io/redhat-cop robot account, given by the instructor).
    # Used by AAP to pull the execution environment and by MTV to pull the VDDK image.
    container_username: <quay robot username>
    container_password: <quay robot token>

    # Red Hat credentials are only needed when the factory installs AAP.
    # RHDP already has AAP, so any non-empty value works.
    rh_username: notused
    rh_password: notused

    # ===== vCenter: from the Lab instructions page ========================================
    # Paste the vCenter link exactly as shown ("Navigate to the vCenter Console"),
    # https:// and a trailing / are fine, e.g. https://vcenter.apps.ocpv07.rhdp.net
    vcenter_url: <vCenter URL from the Lab instructions page>
    vmware_username: <your vCenter user, e.g. user1>
    vmware_password: <your vCenter password>

    # ===== AAP: from the RHDP details page ===============================================
    # Paste the "Automation Controller URL" exactly as shown, https:// is fine,
    # e.g. https://aap-aap.apps.cluster-xxxxx.dyn.redhatworkshops.io
    # It is the address of the AAP LOGIN PAGE (the platform gateway). Do NOT use any other
    # AAP route, e.g. one with "-controller-" in its name.
    aap_url: <Automation Controller URL from the RHDP details page>
    aap_admin_password: <Automation Controller Admin Password>

    # ----- derived values: do not edit below this line -----------------------------------
    vmware_host: "{{ vcenter_url | regex_replace('^https?://', '') | regex_replace('/.*$', '') }}"
    controller_hostname: "{{ aap_url | regex_replace('^https?://', '') | regex_replace('/.*$', '') }}"
    controller_username: admin
    controller_password: "{{ aap_admin_password }}"
    aap_hostname: "{{ controller_hostname }}"
    aap_username: admin
    aap_password: "{{ aap_admin_password }}"

    # --- RHDP: seed the EXISTING AAP instead of installing a new one ---
    aap_version: 2.5                      # AAP version of the RHDP environment
    aap_project_branch: "1.25.0"          # pin the AAP Project to the collection release tag (quoted)
    aap_validate_certs: false             # RHDP routes use self-signed certificates
    aap_request_timeout: 60               # avoid "Failed to get token: read operation timed out"

# Do not install AAP on the cluster: RHDP already provides one.
migration_hub:
  hosts:
    openshift-virt.bootcamp.redhat.com:
      install_aap: false

# The cluster acts as hub and spoke (single-cluster lab layout).
# The host name is only a label; it appears in the AAP template names.
migration_spoke:
  hosts:
    openshift-virt.bootcamp.redhat.com:
      openshift_verify_ssl: false

      # Migration targets (source providers) to configure on this spoke
      configured_migration_targets:
        - vmware-virt-bootcamp

  vars:

    migration_targets:
      - name: vmware-virt-bootcamp
        type: vmware
        host: "{{ vmware_host }}"
        username: "{{ vmware_username }}"
        password: "{{ vmware_password }}"
        insecureSkipTlsVerify: true       # the simulated vCenter uses a self-signed certificate
        vddk:
          image: "{{ mtv_vmware_vddk_init_image }}"
          username: "{{ container_username }}"
          password: "{{ container_password }}"
        mapping:
          create: true
...
